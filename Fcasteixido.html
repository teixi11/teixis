<!doctype html>
<html lang="es">
<head>
  <!-- SDK de Auth0 -->
  <script src="https://cdn.auth0.com/js/auth0-spa-js/1.13/auth0-spa-js.production.js"></script>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>FORECAST — Clientes</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Librerías para visor 3D STL -->
  <script src="/static/build/three.min.js"></script>
  <script src="/static/build/OrbitControls.js"></script>
  <script>var stl_viewer_script_path = "/static/build/";</script>
  <script src="/static/build/webgl_detector.js"></script>
  <script src="/static/build/parser.min.js"></script>
  <script src="/static/build/stl_viewer.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { DEFAULT: '#0071bc', 600: '#0071bc', 700: '#005a91' } },
          boxShadow: { glow: '0 0 0 2px rgba(0,113,188,.18), 0 0 24px rgba(0,113,188,.35)' }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .btn-limpiar-filtros {
      background: linear-gradient(90deg, #e3f2fd 0%, #bbdefb 100%);
      color: #005a91;
      font-weight: 700;
      border-radius: 999px;
      border: none;
      box-shadow: 0 2px 8px rgba(0,113,188,.10);
      padding: .30em .9em;
      margin-left: 1em;
      font-size: .95rem;
      cursor: pointer;
      transition: background .2s;
    }
    [data-client-name] { display: none; }
    .btn-limpiar-filtros:hover {
      background: linear-gradient(90deg, #bbdefb 0%, #e3f2fd 100%);
      color: #0071bc;
    }
    @keyframes iconPulse { 0% { color: #0071bc; } 100% { color: #005a91; } }
    .pulse-glow { animation: glowBreath 2.2s ease-in-out infinite; box-shadow: 0 0 0 0 rgba(0,113,188,.35), 0 0 24px rgba(0,113,188,.35); }
    @keyframes glowBreath { 0%,100% { box-shadow: 0 0 0 2px rgba(0,113,188,.25), 0 0 24px rgba(0,113,188,.35); } 50% { box-shadow: 0 0 0 12px rgba(0,113,188,.12), 0 0 42px rgba(0,113,188,.45); } }
    .skeleton{position:relative;overflow:hidden;background:linear-gradient(90deg,transparent,#00000010,transparent)}
    .skeleton::after{content:"";position:absolute;inset:0;animation:shim 1.2s infinite}
    @keyframes shim{0%{transform:translateX(-100%)}100%{transform:translateX(100%)} }
    .popover{position:absolute; z-index:50; min-width:220px; background:#fff; border-radius:1rem; box-shadow:0 8px 32px rgba(0,0,0,.18); padding:1rem; }
    .popover-search { width:100%; margin-bottom:.5rem; padding:.4rem .7rem; border-radius:.7rem; border:1px solid #0071bc; }
    .popover-list { max-height:220px; overflow:auto; margin-bottom:.5rem; }
    .popover-list label { display:flex; align-items:center; gap:.5rem; padding:.2rem .1rem; cursor:pointer; }
    .popover-list input[type="checkbox"] { accent-color:#0071bc; }
    .popover-btns { display:flex; gap:.5rem; justify-content:flex-end; }
    .logo-bling { filter:drop-shadow(0 8px 28px rgba(0,113,188,.25)); border-radius:.7rem; width:120px; height:48px; object-fit:contain; }
    @keyframes glowPulse{from{box-shadow:0 0 0 rgba(22,163,74,0)} to{box-shadow:0 0 42px rgba(22,163,74,.45)}}
    .segmented{display:inline-flex; background:rgba(0,0,0,.04); border:1px solid rgba(0,0,0,.08); border-radius:9999px; padding:4px}
    .dark .segmented{background:rgba(255,255,255,.04); border-color:#1f2937}
    .segmented button{padding:.4rem .8rem; border-radius:9999px; font-size:.9rem}
    .segmented button.is-active{background:#0071bc; color:#fff; box-shadow:0 4px 14px rgba(0,113,188,.25)}
    @keyframes cardPeek { 0% { transform: translateY(0); box-shadow: 0 2px 8px rgba(0,113,188,.10); } 100% { transform: translateY(-10px); box-shadow: 0 2px 18px 2px #0071bc33; } }
    [data-client-tab] { transition: box-shadow 0.2s, transform 0.2s; will-change: transform, box-shadow; }
    [data-client-tab]:hover { animation: cardPeek 0.38s cubic-bezier(.4,1.6,.6,1) forwards; box-shadow: 0 2px 18px 2px #0071bc33; z-index: 2; }

    @media print {
      body { background: #fff !important; color: #000 !important; }
      header, #loginModal { display: none !important; }
      .clientPanel { box-shadow: none !important; border: 1px solid #ccc !important; }
      button, label[for], input[type="file"], .segmented, .btn-limpiar-filtros { display: none !important; }
      main { margin: 0 !important; padding: 0 !important; }
    }

    .btn-gradient {
      background: linear-gradient(90deg, #60a5fa 0%, #2563eb 100%);
      color: #fff;
      font-weight: 700;
      border-radius: 999px;
      border: none;
      box-shadow: 0 2px 8px rgba(37,99,235,.10);
      padding: .30em .9em;
      font-size: .95rem;
      cursor: pointer;
      transition: background .2s, transform .18s;
    }
    .btn-gradient:hover {
      background: linear-gradient(90deg, #2563eb 0%, #60a5fa 100%);
      transform: scale(1.07) translateY(-2px);
      box-shadow: 0 6px 24px rgba(37,99,235,.18);
    }
    .toast {
      position: fixed;
      right: 2.5em;
      bottom: 2.5em;
      min-width: 220px;
      max-width: 320px;
      background: linear-gradient(90deg, #2563eb 0%, #60a5fa 100%);
      color: #fff;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 1em;
      box-shadow: 0 8px 32px rgba(37,99,235,.18);
      padding: 0.8em 1.2em;
      z-index: 9999;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity .4s, transform .4s;
      display: flex;
      align-items: center;
      gap: 1em;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast .toast-close {
      background: none; border: none; color: #fff; font-size: 1.1em; cursor: pointer; margin-left: auto;
    }
    /* Mantener los botones en una línea (con scroll si falta ancho) */
    .filters-row { flex-wrap: nowrap; overflow-x: auto; gap: .5rem; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-950 dark:text-gray-100">

  <!-- Login modal básico -->
  <div id="loginModal" style="position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.12);z-index:100;display:flex;align-items:center;justify-content:center;">
    <form id="loginForm" style="background:#fff;padding:2rem 2.5rem;border-radius:1rem;box-shadow:0 8px 32px rgba(0,0,0,.18);min-width:320px;display:flex;flex-direction:column;gap:1.2rem;">
      <img src="teixido.png" alt="Teixidó" style="width:120px; margin:0 auto 1.2em auto; display:block; border-radius:1em; box-shadow:0 4px 24px rgba(0,113,188,.18); background:#fff;" />
      <h2 style="font-size:1.5rem;font-weight:700;color:#0071bc;text-align:center;">Iniciar sesión</h2>

      <div id="loginError" style="color:#e53935;text-align:center;font-size:.95rem;display:none;">Usuario o contraseña incorrectos</div>
    </form>
  </div>

  <div id="mainContent" style="display:none;">
    <!-- Top bar -->
    <header class="sticky top-0 z-40 backdrop-blur bg-white/70 dark:bg-gray-950/70 border-b border-gray-200 dark:border-gray-800">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center gap-6">
        <!-- Logo Teixidó apaisado grande -->
  <img src="teixido.jpg" onerror="this.onerror=null;this.src='teixido.png'" alt="Teixidó" style="height:72px; width:auto; max-width:260px; object-fit:contain; border-radius:1rem; background:#fff;" />
        <div class="flex items-center gap-2 ml-6">

        </div>
        <div class="ml-auto flex items-center gap-2">
          <label class="cursor-pointer inline-flex items-center gap-2 px-3 py-2 btn-gradient">
            <input id="fileInput" type="file" accept=".xlsx,.xls" class="hidden">
            <span>LAST</span>
          </label>
          <label class="cursor-pointer inline-flex items-center gap-2 px-3 py-2 btn-gradient">
            <input id="fileInput2" type="file" accept=".xlsx,.xls" class="hidden">
            <span>OLD</span>
          </label>
          <label class="cursor-pointer inline-flex items-center gap-2 px-3 py-2 btn-gradient">
            <input id="fileMci" type="file" accept=".xlsx,.xls" class="hidden">

          <button id="exportPDF" class="px-3 py-2 btn-gradient">PDF</button>

    </header>

    <main class="max-w-7xl mx-auto px-4 py-6">
      <!-- Client tabs -->
      <div class="mt-0 flex gap-2">
        <button class="clientTab px-3 py-2 rounded-xl bg-gray-100 dark:bg-gray-800 font-medium" data-client="Vitesco" data-client-tab>VITESCO</button>
        <button class="clientTab px-3 py-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 font-medium" data-client="Continental" data-client-tab>CONTINENTAL</button>
        <button class="clientTab px-3 py-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 font-medium" data-client="Bosch" data-client-tab>BOSCH</button>
        <button class="clientTab px-3 py-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 font-medium" data-client="MCI" data-client-tab>MCI</button>

    <div class="clientPanel rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-4">
      <!-- Header card -->
      <div class="rounded-2xl p-5 border border-gray-200 dark:border-gray-800 shadow-glow pulse-glow">
        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
          <!-- Left: logo + name + filters -->
          <div class="flex-1 min-w-0 flex items-center gap-5">
            <div class="w-full flex flex-col items-center justify-center">
              <div style="display: flex; justify-content: center; align-items: center; height: 160px;">
                <img data-client-logo class="object-contain bg-white dark:bg-gray-800" style="width:260px;height:110px;" src="" alt="Logo" />
              </div>

          <div class="flex-1 min-w-0">

              <button type="button" class="btn-limpiar-filtros btn-gradient" id="btnLimpiarFiltros">Limpiar filtros</button>
              <button type="button" class="btn-gradient" id="btnTop5">Top 5 piezas</button>
              <select class="filter-year hidden" multiple size="4"></select>

                </div>
                <div>

                  <div class="text-xl font-bold" data-kpi-rows>—</div>
                </div>
                <div>
                  <div class="text-xs text-gray-500">Refs únicas</div>
                  <div class="text-xl font-bold" data-kpi-refs>—</div>
                </div>
                <div>
                  <div class="text-xs text-gray-500">Plantas</div>
                  <div class="text-xl font-bold" data-kpi-plantas>—</div>

              </div>

      <!-- Menu inside tab -->
      <div class="mt-4 flex items-center gap-3">

        <div class="segmented" data-groupby>
          <button class="is-active" data-val="month">Mes</button>
          <button data-val="week">Semana</button>
          <button data-val="day">Día</button>
        </div>

      <!-- Chart -->
      <div class="mt-3 rounded-2xl border border-gray-200 dark:border-gray-800 p-4">
        <div class="mb-2 text-lg font-semibold text-brand-700 text-center" id="chartFiltersTitle" style="margin-bottom:0.5rem;"></div>
        <div style="position:relative; width:100%; height:360px;">
          <canvas class="mainChart" style="width:100%; height:100%; display:block;"></canvas>
        </div>
      </div>

      <!-- Tabla resumen Año x Mes -->
      <div class="mt-4 rounded-2xl border border-gray-200 dark:border-gray-800 p-4 overflow-auto">
        <div class="font-semibold mb-2 text-brand-700" id="tableFiltersTitle">Resumen por año y mes</div>
        <table class="summaryTable min-w-full text-sm">
          <thead>
            <tr>
              <th class="px-2 py-1 text-left">Año</th>
              <th class="px-2 py-1 text-right">E</th>
              <th class="px-2 py-1 text-right">F</th>
              <th class="px-2 py-1 text-right">M</th>
              <th class="px-2 py-1 text-right">A</th>
              <th class="px-2 py-1 text-right">M</th>
              <th class="px-2 py-1 text-right">J</th>
              <th class="px-2 py-1 text-right">J</th>
              <th class="px-2 py-1 text-right">A</th>
              <th class="px-2 py-1 text-right">S</th>
              <th class="px-2 py-1 text-right">O</th>
              <th class="px-2 py-1 text-right">N</th>
              <th class="px-2 py-1 text-right">D</th>
              <th class="px-2 py-1 text-right">Total</th>
            </tr>

          <tbody></tbody>

  </template>

  <!-- Modal Top 5 -->
  <div id="top5Modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 hidden">
    <div class="bg-white dark:bg-gray-900 rounded-xl shadow-2xl p-4 max-w-md w-full relative border border-gray-300 dark:border-gray-700" style="max-height:80vh; overflow-y:auto;">
      <button id="closeTop5" class="absolute top-4 right-4 text-2xl font-bold text-gray-500 hover:text-red-600">&times;</button>
      <h2 class="text-2xl font-bold mb-6 text-center">Top 5 piezas más pedidas</h2>
      <div id="top5List" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
    </div>
  </div>

  <script>
    // ---------- Login básico ----------
    const USERS = [
      {user: 'admin', pass: '1234'},
      {user: 'teixido', pass: 'forecast'}
    ];

    function isLoggedIn() { return localStorage.getItem('loggedUser'); }
    function showLogin() { document.getElementById('loginModal').style.display = 'flex'; document.getElementById('mainContent').style.display = 'none'; }
    function showMain() { document.getElementById('loginModal').style.display = 'none'; document.getElementById('mainContent').style.display = 'block'; }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value;
      const found = USERS.find(x => x.user === u && x.pass === p);
      if (found) {
        localStorage.setItem('loggedUser', u);
        showMain();
        document.getElementById('loginError').style.display = 'none';
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem('loggedUser');
      showLogin();
    });

    if (isLoggedIn()) { showMain(); } else { showLogin(); }
    window.addEventListener('DOMContentLoaded', function() {
      localStorage.removeItem('loggedUser');
      showLogin();
    });

    // ---------- Estado ----------
    const state = {
      rows: [], // Excel 1
      rows2: [], // Excel 2
      mciRows: [], // Excel MCI
      mapCliToTeix: new Map(), // A->B (Hoja2)
      mapTeixToCli: new Map(),
      charts: new Map(), // client -> Chart instance
      currentClient: 'Vitesco'
    };

  const CLIENTS = ['Vitesco','Continental','Bosch','MCI'];
  const LOGO_MAP = { Vitesco:'VT.jpg', Continental:'CONTINENTAL.jpg', Bosch:'BOSCH.jpg', MCI:'MCI.jpg' };
    const LOGO_BASE = './logos/';
    const fmt = new Intl.NumberFormat('es-ES');

    function logoCandidates(client){
      const mapped = LOGO_MAP[client] || '';
      const stem = (mapped ? mapped.replace(/\.(jpg|jpeg|png|webp)$/i,'') : client).toString();
      const stems = [stem, stem.toUpperCase(), stem.toLowerCase()];
      const exts = ['.jpg','.jpeg','.png','.webp'];
      const list = [];
      if(mapped){ list.push(mapped); list.push(mapped.toLowerCase()); }
      stems.forEach(s=> exts.forEach(e=> list.push(s+e)));
      return [...new Set(list)];
    }

    function setClientLogo(imgEl, client){
      const cands = logoCandidates(client);
      if(!cands.length){ imgEl.classList.add('hidden'); return; }
      imgEl.classList.remove('hidden');
      imgEl.dataset.cands = JSON.stringify(cands);
      imgEl.onerror = function(){
        try{
          const arr = JSON.parse(this.dataset.cands||'[]');
          arr.shift();
          if(arr.length){
            this.dataset.cands = JSON.stringify(arr);
            this.src = LOGO_BASE + arr[0];
          }else{
            this.onerror = null; this.src = '';
            this.classList.add('hidden');
          }
        }catch{ this.onerror=null; this.classList.add('hidden'); }
      };
      imgEl.src = LOGO_BASE + cands[0];
    }

    // ---------- Aliases de cliente (columna G) ----------
    const CLIENT_ALIASES = {
      vitesco: ['vt'],
      continental: ['aumov'],
      bosch: ['bosch','uaes'],
      mci: ['mci']
    };
    const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
    function matchesClient(cellValue, tabName){
      const a = norm(cellValue);
      const key = norm(tabName);
      const list = CLIENT_ALIASES[key] || [key];
      return list.some(alias => a.includes(alias));
    }

    // ---------- Tema ----------
    const darkToggle = document.querySelector('#darkToggle');
    const savedTheme = localStorage.getItem('theme');
    if(savedTheme==='dark'){ document.documentElement.classList.add('dark'); darkToggle.checked = true; }
    darkToggle.addEventListener('change', e=>{
      document.documentElement.classList.toggle('dark', e.target.checked);
      localStorage.setItem('theme', e.target.checked?'dark':'light');
      CLIENTS.forEach(c=> drawChart(c));
    });

    // ---------- Tabs cliente ----------
    document.querySelectorAll('.clientTab').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        document.querySelectorAll('.clientTab').forEach(b=> b.classList.remove('bg-gray-100','dark:bg-gray-800'));
        btn.classList.add('bg-gray-100','dark:bg-gray-800');
        state.currentClient = btn.dataset.client;
        renderPanels();
      });
    });

    // ---------- Archivo ----------
    document.querySelector('#fileInput').addEventListener('change', e=>{
      const f = e.target.files?.[0]; if(f) loadExcel(f, 1);
    });
    document.querySelector('#fileInput2').addEventListener('change', e=>{
      const f = e.target.files?.[0]; if(f) loadExcel(f, 2);
    });
    // Excel MCI (formato específico)
    document.querySelector('#fileMci').addEventListener('change', e=>{
      const f = e.target.files?.[0]; if(f) loadMciExcel(f);
    });

    // ---------- Export ----------
    document.querySelector('#exportPDF').addEventListener('click', ()=>{ window.print(); });
    document.querySelector('#exportCSV').addEventListener('click', ()=>{
      const root = document.querySelector(`.clientPanel[data-client="${state.currentClient}"]`);
      const rows = getFilteredRows(state.currentClient, root, state.rows2.length ? 1 : undefined);
      if(!rows.length){ alert('No hay datos filtrados'); return; }
      const header = ['cliente','fecha','año','mes','ref_cliente','ref_teixido','planta','cantidad'];
      const csv = [header.join(',')].concat(rows.map(r=>[
        esc(r.cliente), r.fecha.toISOString().slice(0,10), r.anio, r.mes,
        esc(r.refCli||''), esc(r.refTeix||''), esc(r.planta||''), r.qty
      ].join(','))).join('\n');
      const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = state.currentClient+'_datos.csv'; a.click();
      URL.revokeObjectURL(url);
    });
    const esc = s => ('"'+String(s).replace(/"/g,'""')+'"' );

    // ---------- Construcción paneles ----------
    function renderPanels(){
      const panels = document.querySelector('#panels');
      panels.innerHTML = '';
      const tpl = document.querySelector('#clientPanelTpl').content.cloneNode(true);
      const root = tpl.querySelector('.clientPanel');
      root.dataset.client = state.currentClient;
      const clientUpper = state.currentClient.toUpperCase();
      root.querySelector('[data-client-name]').textContent = clientUpper;
      const logo = root.querySelector('[data-client-logo]');
      logo.alt = `Logo ${clientUpper}`;
      setClientLogo(logo, state.currentClient);

      // Filtros
      const selYear = tpl.querySelector('.filter-year');
      const selMonth = tpl.querySelector('.filter-month');
      const selRef = tpl.querySelector('.filter-ref');

      const rowsC = (state.currentClient==='MCI')
        ? state.mciRows.slice()
        : state.rows.filter(r=> matchesClient(r.cliente, state.currentClient));

      const years = [...new Set(rowsC.map(r=> r.anio).filter(Boolean))].sort((a,b)=>a-b);
      selYear.innerHTML = years.map(y=>`<option value="${y}">${y}</option>`).join('');

      selMonth.innerHTML = Array.from({length:12}, (_,i)=>`<option value="${i+1}">${i+1}</option>`).join('');

      const refSet = new Set();
      rowsC.forEach(r=>{
        if(r.refCli) refSet.add('CLI:'+r.refCli);
        if(r.refTeix) refSet.add('TEI:'+r.refTeix);
        if(state.currentClient==='MCI' && r.ref) refSet.add('MCI:'+r.ref);
      });
      selRef.innerHTML = [...refSet].sort().map(tag=>{
        const [type,val] = tag.split(':');
        const label = (type==='CLI'?'[CLI] ': type==='TEI'?'[TEI] ':'[MCI] ') + val;
        return `<option value="${val}">${label}</option>`;
      }).join('');

      const plantaSet = new Set(rowsC.map(r=> r.planta).filter(Boolean));
      const selPlanta = tpl.querySelector('.filter-planta');
      selPlanta.innerHTML = [...plantaSet].sort().map(p=>`<option value="${p}">${p}</option>`).join('');

      tpl.querySelector('.filter-btn-year').onclick = (e)=>{
        e.preventDefault();
        openPopoverForSelectWithSearch(selYear, 'Años', ()=>{ onFilterChange(root); }, e.target);
      };
      tpl.querySelector('.filter-btn-month').onclick = (e)=>{
        e.preventDefault();
        openPopoverForSelectWithSearch(selMonth, 'Meses', ()=>{ onFilterChange(root); }, e.target);
      };
      tpl.querySelector('.filter-btn-ref').onclick = (e)=>{
        e.preventDefault();
        openPopoverForSelectWithSearch(selRef, 'Referencias', ()=>{ onFilterChange(root); }, e.target);
      };
      tpl.querySelector('.filter-btn-planta').onclick = (e)=>{
        e.preventDefault();
        openPopoverForSelectWithSearch(selPlanta, 'Plantas', ()=>{ onFilterChange(root); }, e.target);
      };

      const grp = tpl.querySelector('[data-groupby]');
      grp.addEventListener('click', (e)=>{
        if(!(e.target instanceof HTMLElement)) return;
        const btn = e.target.closest('button');
        if(!btn) return;
        grp.querySelectorAll('button').forEach(b=> b.classList.remove('is-active'));
        btn.classList.add('is-active');
        drawChart(state.currentClient, root);
      });

      panels.appendChild(tpl);

      const rootEl = panels.querySelector('.clientPanel');

      const btnLimpiar = rootEl.querySelector('#btnLimpiarFiltros');
      if (btnLimpiar) {
        btnLimpiar.onclick = function() {
          rootEl.querySelectorAll('.filter-year, .filter-month, .filter-ref, .filter-planta').forEach(sel => {
            Array.from(sel.options).forEach(opt => opt.selected = false);
          });
          updateKPIs(rootEl);
          drawChart(state.currentClient, rootEl);
          drawSummaryTable(state.currentClient, rootEl);
        };
      }

      enhanceForTouch(rootEl);

      updateKPIs(rootEl);
      drawChart(state.currentClient, rootEl);
      drawSummaryTable(state.currentClient, rootEl);
    }

    function onFilterChange(root){
      updateKPIs(root);
      drawChart(state.currentClient, root);
      drawSummaryTable(state.currentClient, root);
    }

    // (Eliminado: etiquetas MCI)

    function getMultiSelectValues(selectEl){
      return Array.from(selectEl.selectedOptions || []).map(o=> o.value);
    }

    function getFilters(root){
      const years = getMultiSelectValues(root.querySelector('.filter-year')).map(Number);
      const months = getMultiSelectValues(root.querySelector('.filter-month')).map(Number);
      const refs = getMultiSelectValues(root.querySelector('.filter-ref'));
      const plantas = getMultiSelectValues(root.querySelector('.filter-planta'));
      const grp = root.querySelector('[data-groupby]');
      const active = grp?.querySelector('button.is-active')?.dataset?.val || 'month';
      const groupBy = active;
      return {years, months, refs, plantas, groupBy};
    }

    function getFilteredRows(client, root, which=1){
      let base = [];
      if (client==='MCI' || which==='MCI') {
        base = state.mciRows.slice();
      } else {
        base = (which===2 ? state.rows2 : state.rows).filter(r=> matchesClient(r.cliente, client));
      }
      if(!root) return base;
      const {years, months, refs, plantas} = getFilters(root);
      return base.filter(r=>{
        if(years.length && !years.includes(Number(r.anio))) return false;
        if(months.length && !months.includes(Number(r.mes))) return false;
        if(refs.length){
          const rc = (r.refCli||''); const rt = (r.refTeix||''); const rm = (r.ref||'');
          const hit = refs.includes(rc) || refs.includes(rt) || refs.includes(rm);
          if(!hit) return false;
        }
        if(plantas.length && !plantas.includes(r.planta)) return false;
        return true;
      });
    }

    function updateKPIs(root){
      const rows = getFilteredRows(state.currentClient, root, (state.currentClient==='MCI' ? 'MCI' : 1));
      const qty = rows.reduce((s,r)=> s + (Number(r.qty)||0), 0);
      const refsSet = new Set(rows.map(r=> r.refCli||r.refTeix||r.ref||''));
      const plantasSet = new Set(rows.map(r=> r.planta||''));
      root.querySelector('[data-kpi-cantidad]').textContent = fmt.format(qty);
      root.querySelector('[data-kpi-rows]').textContent = fmt.format(rows.length);
      root.querySelector('[data-kpi-refs]').textContent = fmt.format([...refsSet].filter(Boolean).length);
      root.querySelector('[data-kpi-plantas]').textContent = fmt.format([...plantasSet].filter(Boolean).length);
      const filtersBar = root.querySelector('#activeFiltersBar');
      if(!filtersBar) return;
      const {years, months, refs, plantas} = getFilters(root);
      let html = '';
      if(years.length) { html += `<span class="inline-flex items-center gap-1 px-2 py-1 rounded bg-brand-600 text-white text-xs mr-2">Año: ${years.join(', ')} <button class="ml-1" onclick="this.parentNode.remove();">✕</button></span>`; }
      if(months.length) { html += `<span class="inline-flex items-center gap-1 px-2 py-1 rounded bg-brand-600 text-white text-xs mr-2">Mes: ${months.join(', ')} <button class="ml-1" onclick="this.parentNode.remove();">✕</button></span>`; }
      if(refs.length) { html += `<span class="inline-flex items-center gap-1 px-2 py-1 rounded bg-brand-600 text-white text-xs mr-2">Ref: ${refs.join(', ')} <button class="ml-1" onclick="this.parentNode.remove();">✕</button></span>`; }
      if(plantas.length) { html += `<span class="inline-flex items-center gap-1 px-2 py-1 rounded bg-brand-600 text-white text-xs mr-2">Planta: ${plantas.join(', ')} <button class="ml-1" onclick="this.parentNode.remove();">✕</button></span>`; }
      if(!html) { html = `<span class="text-xs text-gray-400">Sin filtros aplicados</span>`; }
      filtersBar.innerHTML = html;

      const tableTitle = root.querySelector('#tableFiltersTitle');
      if(tableTitle) tableTitle.textContent = 'Resumen por año y mes';

      const chartTitle = root.querySelector('#chartFiltersTitle');
      if(chartTitle) {
        const clientName = state.currentClient ? state.currentClient.toUpperCase() : '-';
        const añoTxt = years.length ? years.join(', ') : 'TODOS';
        const mesTxt = months.length ? months.join(', ') : 'TODOS';
        const refTxt = refs.length ? refs.join(', ') : 'TODOS';
        const plantaTxt = plantas.length ? plantas.join(', ') : 'TODOS';
        chartTitle.innerHTML = `<span style='font-weight:bold;text-transform:uppercase;'>Cliente:</span> ${clientName} · <span style='font-weight:bold;text-transform:uppercase;'>Año:</span> ${añoTxt} · <span style='font-weight:bold;text-transform:uppercase;'>Mes:</span> ${mesTxt} · <span style='font-weight:bold;text-transform:uppercase;'>Referencia:</span> ${refTxt} · <span style='font-weight:bold;text-transform:uppercase;'>Planta:</span> ${plantaTxt}`;
      }
    }

    function drawChart(client, root){
      root = root || document.querySelector(`.clientPanel[data-client="${client}"]`);
      const canvas = root.querySelector('.mainChart');
      const ctx = canvas.getContext('2d');
      const rows1 = getFilteredRows(client, root, (client==='MCI' ? 'MCI' : 1));
      const rows2 = (client==='MCI') ? [] : getFilteredRows(client, root, 2);
      const {groupBy} = getFilters(root);

      const keyFn = {
        day: (d)=> d.toISOString().slice(0,10),
        week: (d)=> {
          const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
          const day = (t.getUTCDay()||7); t.setUTCDate(t.getUTCDate()+4-day);
          const y = t.getFullYear();
          const y0 = new Date(Date.UTC(y,0,1));
          const w = Math.ceil((((t - y0)/86400000)+1)/7);
          return `${y}-W${String(w).padStart(2,'0')}`;
        },
        month: (d)=> `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`
      }[groupBy];

      const groups1 = new Map();
      rows1.forEach(r=>{
        const k = keyFn(r.fecha);
        groups1.set(k, (groups1.get(k)||0) + (Number(r.qty)||0));
      });
      const groups2 = new Map();
      rows2.forEach(r=>{
        const k = keyFn(r.fecha);
        groups2.set(k, (groups2.get(k)||0) + (Number(r.qty)||0));
      });

      const allLabels = Array.from(new Set([...groups1.keys(), ...groups2.keys()])).sort();
      const data1 = allLabels.map(k=> groups1.get(k)||0);
      const data2 = allLabels.map(k=> groups2.get(k)||0);

      const datasets = [];
      if (rows1.length) {
        datasets.push({
          label: `${client==='MCI'?'MCI':'LAST'} · ${client} · ${groupBy}`,
          data: data1,
          fill: true,
          tension: .25,
          borderColor: 'rgba(0,0,0,0.08)',
          backgroundColor: client==='MCI' ? 'rgba(99,102,241,0.45)' : 'rgba(0,113,188,0.45)',
          borderWidth: 1,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointBackgroundColor: client==='MCI' ? '#6366f1' : '#0071bc'
        });
      }
      if (rows2.length) {
        datasets.push({
          label: `OLD · ${client} · ${groupBy}`,
          data: data2,
          fill: true,
          tension: .25,
          borderColor: 'rgba(0,0,0,0.08)',
          backgroundColor: 'rgba(229,57,53,0.45)',
          borderWidth: 1,
          pointRadius: 0,
          pointHoverRadius: 4,
          pointBackgroundColor: '#e53935'
        });
      }

      const prev = state.charts.get(client);
      if(prev){ prev.destroy(); }
      const chart = new Chart(ctx, {
        type: 'line',
        data: { labels: allLabels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          elements: { point: { radius: 0 } },
          animation: { duration: 1200, easing: 'easeOutElastic', animateScale: true, animateRotate: true },
          scales: {
            x: { grid: { display: false }, title: { display: true, text: 'Fecha (según agrupación)' } },
            y: { beginAtZero: true, grid: { display: false }, title: { display: true, text: 'Cantidad total' } }
          },
          plugins: { legend: { display: true }, tooltip: { enabled: true } },
          interaction: { mode: 'index', intersect: false }
        }
      });
      state.charts.set(client, chart);
    }

    // ---- Tabla resumen Año x Mes + Total ----

          <th class="px-2 py-1 text-right">F</th>
          <th class="px-2 py-1 text-right">M</th>
          <th class="px-2 py-1 text-right">A</th>
          <th class="px-2 py-1 text-right">M</th>
          <th class="px-2 py-1 text-right">J</th>
          <th class="px-2 py-1 text-right">J</th>
          <th class="px-2 py-1 text-right">A</th>

  // ---------- Lectura Excel ----------
    async function loadExcel(file, which=1){
      if(which===1) document.querySelector('#fileBadge').textContent = file.name;
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, {type:'array'});

      // Hoja2: equivalencias (solo para el primer archivo)
      if(which===1){
        state.mapCliToTeix.clear(); state.mapTeixToCli.clear();
        if(wb.SheetNames[1]){
          const ws2 = wb.Sheets[wb.SheetNames[1]];
          const range2 = XLSX.utils.decode_range(ws2['!ref']);
          for(let r=range2.s.r+1; r<=range2.e.r; r++){
            const a = (ws2[XLSX.utils.encode_cell({c:0,r})]||{}).v;
            const b = (ws2[XLSX.utils.encode_cell({c:1,r})]||{}).v;
            if(a!=null && b!=null){
              state.mapCliToTeix.set(String(a).trim(), String(b).trim());
              state.mapTeixToCli.set(String(b).trim(), String(a).trim());
            }
          }
        }
      }

      // Hoja1
      const ws = wb.Sheets['Last LAR'] || wb.Sheets[wb.SheetNames[0]];
      const range = XLSX.utils.decode_range(ws['!ref']);
      const col = (letters)=> XLSX.utils.decode_col(letters);
      const CANT = col('AM'), FECHA = col('BX'), ANIO = col('BZ'), MES = col('CA'),
            CLI = col('G'), REF_TEIX = col('BV'), PLANTA = col('BW'),
            REF_CLI = col('T'); // NUEVO: columna T (ref cliente / nombre pieza según cliente)

      const rows = [];
      for(let r=range.s.r+1; r<=range.e.r; r++){
        const cellObj = (c)=> ws[XLSX.utils.encode_cell({c,r})];
        const vQty = cellObj(CANT)?.v;
        const vFecha = cellObj(FECHA)?.v;
        const vAnio = cellObj(ANIO)?.v;
        const vMes = cellObj(MES)?.v;
        const vCli = cellObj(CLI)?.v;
        const vRefTeix = cellObj(REF_TEIX)?.v;
        const vPlanta = cellObj(PLANTA)?.v;
        const vRefCliT = cellObj(REF_CLI)?.v; // <-- leemos T

        if(vCli==null || vFecha==null) continue;

        const fecha = parseExcelDate(vFecha);
        const qty = Number(vQty||0);
        const anio = Number(vAnio || (fecha? fecha.getFullYear(): null));
        const mes = Number(vMes || (fecha? fecha.getMonth()+1 : null));

        let refTeix = vRefTeix!=null ? String(vRefTeix).trim() : null;

        // refCli: prioriza T; si no hay, intenta mapear desde BV
        let refCli = null;
        if (vRefCliT != null && vRefCliT !== '') {
          refCli = String(vRefCliT).trim();
        } else if (refTeix && state.mapTeixToCli.has(refTeix)) {
          refCli = state.mapTeixToCli.get(refTeix);
        }

        rows.push({
          cliente: String(vCli).trim(),
          fecha, anio, mes,
          refCli,      // T o mapeo
          refTeix,     // BV
          planta: vPlanta!=null? String(vPlanta).trim() : null,
          qty
        });
      }

      if(which===1){
        state.rows = rows.filter(r=> r.fecha instanceof Date && !isNaN(r.fecha));
      }else{
        state.rows2 = rows.filter(r=> r.fecha instanceof Date && !isNaN(r.fecha));

        // Toast de diferencias
        CLIENTS.forEach(cliente => {
          const rows1 = state.rows.filter(r => matchesClient(r.cliente, cliente));
          const rows2 = state.rows2.filter(r => matchesClient(r.cliente, cliente));
          const piezas1 = rows1.reduce((s, r) => s + (Number(r.qty)||0), 0);
          const piezas2 = rows2.reduce((s, r) => s + (Number(r.qty)||0), 0);
          const diff = piezas1 - piezas2;
          if (diff !== 0) {
            const refsAll = Array.from(new Set(rows1.map(r => r.refCli || r.refTeix || '').concat(rows2.map(r => r.refCli || r.refTeix || '')))).filter(Boolean);
            const refsDiffs = refsAll.map(ref => {
              const sum1 = rows1.filter(r => (r.refCli === ref || r.refTeix === ref)).reduce((s, r) => s + (Number(r.qty)||0), 0);
              const sum2 = rows2.filter(r => (r.refCli === ref || r.refTeix === ref)).reduce((s, r) => s + (Number(r.qty)||0), 0);
              return { ref, diff: sum1 - sum2 };
            }).filter(r => r.diff !== 0);
            const meses1 = new Set(rows1.map(r => r.mes).filter(Boolean));
            const meses2 = new Set(rows2.map(r => r.mes).filter(Boolean));
            const mesesAfectados = [...meses1].filter(m => !meses2.has(m)).concat([...meses2].filter(m => !meses1.has(m)));
            const plantas1 = new Set(rows1.map(r => r.planta).filter(Boolean));
            const plantas2 = new Set(rows2.map(r => r.planta).filter(Boolean));
            const plantasAfectadas = [...plantas1].filter(p => !plantas2.has(p)).concat([...plantas2].filter(p => !plantas1.has(p)));
            showToastDiferencia(cliente, diff, refsAll, mesesAfectados, plantasAfectadas, refsDiffs);
          }
        });
      }
      renderPanels();
    }

    // ---------- Lectura Excel MCI (robusta por cabeceras + fallback posicional) ----------
    async function loadMciExcel(file){
      try{
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        if(!ws || !ws['!ref']) throw new Error('Hoja vacía o inválida');
        const range = XLSX.utils.decode_range(ws['!ref']);

        const normH = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[\s\.:]/g,'').trim();
        const monthMap = {
          'ene':1,'enero':1,'jan':1,'january':1,
          'feb':2,'febrero':2,'february':2,
          'mar':3,'marzo':3,'march':3,
          'abr':4,'abril':4,'apr':4,'april':4,
          'may':5,'mayo':5,
          'jun':6,'junio':6,'june':6,
          'jul':7,'julio':7,'july':7,
          'ago':8,'agosto':8,'aug':8,'august':8,
          'sep':9,'sept':9,'septiembre':9,'september':9,
          'oct':10,'octubre':10,'october':10,
          'nov':11,'noviembre':11,'november':11,
          'dic':12,'diciembre':12,'dec':12,'december':12
        };

        // Detectar fila de cabeceras (primeras 4 filas que tengan alguna coincidencia)
        let headerRow = range.s.r;
        let headerFound = false;
        for(let r=range.s.r; r<=Math.min(range.s.r+4, range.e.r); r++){
          let refHit = false;
          for(let c=range.s.c; c<=range.e.c; c++){
            const v = ws[XLSX.utils.encode_cell({c,r})]?.v;
            const n = normH(v);
            if(n==='ref' || n==='referencia' || n==='refcliente' || n==='ref.'){
              refHit = true; break;
            }
          }
          if(refHit){ headerRow = r; headerFound = true; break; }
        }

        // Mapear nombres -> columnas
        let colQty, colMes, colAnio, colRef;
        if(headerFound){
          for(let c=range.s.c; c<=range.e.c; c++){
            const v = ws[XLSX.utils.encode_cell({c: c, r: headerRow})]?.v;
            const n = normH(v);
            if(colRef==null && (n==='ref'||n==='ref.'||n==='refcliente'||n==='referencia')) colRef = c;
            else if(colMes==null && (n==='mes'||n==='month')) colMes = c;
            else if(colAnio==null && (n==='ano'||n==='año'||n==='year')) colAnio = c;
            else if(colQty==null && (n==='cantidad'||n==='qty'||n==='cantidadtotal'||n==='cant')) colQty = c;
          }
        }
        // Fallback posicional si falta algo (B=qty, E=mes, F=año, G=ref)
        const byLetter = l => XLSX.utils.decode_col(l);
        if(colQty==null) colQty = byLetter('B');
        if(colMes==null) colMes = byLetter('E');
        if(colAnio==null) colAnio = byLetter('F');
        if(colRef==null) colRef = byLetter('G');

        const startRow = headerFound ? headerRow+1 : range.s.r+1;
        const rows = [];
        for(let r=startRow; r<=range.e.r; r++){
          const cell = (c)=> ws[XLSX.utils.encode_cell({c,r})]?.v;
          const vRef = cell(colRef);
          if(vRef==null || String(vRef).trim()==='') continue;
          const vQty = cell(colQty);
          let vMes = cell(colMes);
          let vAnio = cell(colAnio);
          // Mes puede venir como número o texto
          let mesNum = Number(vMes);
          if(!mesNum || isNaN(mesNum)){
            const nm = normH(vMes);
            mesNum = monthMap[nm] || null;
          }
          const anioNum = Number(vAnio);
          if(!anioNum || !mesNum) continue;
          const fecha = new Date(Date.UTC(anioNum, mesNum-1, 1));
          rows.push({
            cliente: 'MCI',
            fecha,
            anio: anioNum,
            mes: mesNum,
            ref: String(vRef).trim(),
            planta: null,
            qty: Number(vQty||0)
          });
        }
        state.mciRows = rows.filter(r=> r.fecha instanceof Date && !isNaN(r.fecha));

        // Cambiar a la pestaña MCI y re-render
        state.currentClient = 'MCI';
        document.querySelectorAll('.clientTab').forEach(b=>{
          const isMci = b.dataset.client==='MCI';
          b.classList.toggle('bg-gray-100', isMci);
          b.classList.toggle('dark:bg-gray-800', isMci);
        });
        renderPanels();
      }catch(err){
        console.error('Error leyendo Excel MCI:', err);
        alert('No se pudo leer el Excel de MCI. Asegúrate de que existen columnas Ref., Mes y Año, o que siguen el esquema B=qty, E=mes, F=año, G=ref.');
      }
    }

    function parseExcelDate(v){
      if(v==null) return null;
      if(typeof v === 'number'){
        const o = XLSX.SSF.parse_date_code(v);
        if(!o) return null;
        return new Date(Date.UTC(o.y, o.m-1, o.d, o.H||0, o.M||0, o.S||0));
      }
      if(typeof v==='string'){
        const t1 = /^\d{4}-\d{2}-\d{2}/.test(v) ? new Date(v) : NaN;
        if(!isNaN(t1)) return t1;
        const m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
        if(m){
          const dd=+m[1], mm=+m[2]-1, yy=m[3].length===2? 2000+ +m[3] : +m[3];
          return new Date(Date.UTC(yy,mm,dd));
        }
      }
      const d = new Date(v);
      return isNaN(d)? null : d;
    }

    // ---------- iPad / táctil: popovers ----------
    function enhanceForTouch(root){
      const setups = [
        {sel:'.filter-year', btn:'.btn-touch-year', label:'Años'},
        {sel:'.filter-month', btn:'.btn-touch-month', label:'Meses'},
        {sel:'.filter-ref', btn:'.btn-touch-ref', label:'Referencias'}
      ];
      setups.forEach(({sel,btn,label})=>{
        const selectEl = root.querySelector(sel);
        const btnEl = root.querySelector(btn);
        if(!selectEl || !btnEl) return;
        selectEl.classList.add('hidden');
        btnEl.classList.remove('hidden');
        btnEl.addEventListener('click', (e)=>{
          e.preventDefault();
          openPopoverForSelectWithSearch(selectEl, label, ()=>{ onFilterChange(root); }, btnEl);
        });
      });
    }

    function openPopoverForSelectWithSearch(selectEl, title, onApply, fromBtn){
      closeAnyPopover();
      let left = window.innerWidth/2-120, top = window.innerHeight/2-100;
      if (fromBtn) {
        const rect = fromBtn.getBoundingClientRect();
        left = rect.left + window.scrollX;
        top = rect.bottom + 8 + window.scrollY;
      }
      const pop = document.createElement('div');
      pop.className = 'popover';
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
      const header = document.createElement('div');
      header.className = 'font-semibold mb-2 text-brand-700 text-base';
      header.textContent = title;
      pop.appendChild(header);
      const search = document.createElement('input');
      search.type = 'text';
      search.className = 'popover-search text-base px-3 py-2 border border-brand-600 rounded-lg mb-2';
      search.placeholder = 'Buscar...';
      pop.appendChild(search);
      const list = document.createElement('div');
      list.className = 'popover-list';
      pop.appendChild(list);
      function renderList(){
        list.innerHTML = '';
        const q = search.value.toLowerCase();
        [...selectEl.options].forEach((opt, idx)=>{
          if(!opt.text.toLowerCase().includes(q)) return;
          const row = document.createElement('label');
          row.className = 'flex items-center gap-2 text-base font-medium px-2 py-1 rounded hover:bg-brand-100 cursor-pointer';
          row.innerHTML = `<input type="checkbox" ${opt.selected?'checked':''} data-index="${idx}"> <span>${opt.text}</span>`;
          list.appendChild(row);
        });
      }
      search.addEventListener('input', renderList);
      renderList();
      const btns = document.createElement('div');
      btns.className = 'popover-btns';
      btns.innerHTML = `<button data-act="all" class="px-3 py-1 rounded bg-brand-600 text-white">Todo</button><button data-act="none" class="px-3 py-1 rounded bg-gray-200">Ninguno</button><button data-act="cancel" class="px-3 py-1 rounded bg-gray-200">Cancelar</button><button data-act="apply" class="px-3 py-1 rounded bg-brand-600 text-white">Aplicar</button>`;
      pop.appendChild(btns);
      btns.addEventListener('click', (ev)=>{
        const act = ev.target?.dataset?.act;
        if(act==='all'){
          list.querySelectorAll('input[type="checkbox"]').forEach(c=> c.checked=true);
        } else if(act==='none'){
          list.querySelectorAll('input[type="checkbox"]').forEach(c=> c.checked=false);
        } else if(act==='cancel'){
          closeAnyPopover();
        } else if(act==='apply'){
          const checks = [...list.querySelectorAll('input[type="checkbox"]')];
          checks.forEach(ch=>{
            const idx = Number(ch.dataset.index);
            selectEl.options[idx].selected = ch.checked;
          });
          closeAnyPopover();
          onApply && onApply();
        }
      });
      document.body.appendChild(pop);
      window._popoverDocClose = function(e){
        if(!pop.contains(e.target)) {
          closeAnyPopover();
          document.removeEventListener('click', window._popoverDocClose);
          window._popoverDocClose = null;
        }
      };
      setTimeout(()=> document.addEventListener('click', window._popoverDocClose), 0);
    }

    function closeAnyPopover(){
      document.querySelectorAll('.popover').forEach(p=> p.remove());
      if(window._popoverDocClose) {
        document.removeEventListener('click', window._popoverDocClose);
        window._popoverDocClose = null;
      }
    }

    function showToastDiferencia(cliente, piezasDiff, refs, meses, plantas, refsDiffs) {
      let toast = document.querySelector('.toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast';
        document.body.appendChild(toast);
      }
      const totalOld = piezasDiff < 0 ? Math.abs(piezasDiff) + refsDiffs.reduce((s, r) => s + (r.diff < 0 ? Math.abs(r.diff) : 0), 0) : refsDiffs.reduce((s, r) => s + (r.diff < 0 ? Math.abs(r.diff) : 0), 0);
      const porcentaje = totalOld ? (((piezasDiff * -1) / totalOld)).toFixed(1) : '0';
      let signo = '';
      if (porcentaje > 0) signo = '+';
      else if (porcentaje < 0) signo = '-';
      toast.innerHTML = `<span>${cliente.toUpperCase()}: Variación de ${signo}${Math.abs(porcentaje)}% cantidad piezas</span><button class='toast-close' title='Cerrar'>&times;</button>`;
      toast.classList.add('show');
      toast.querySelector('.toast-close').onclick = () => toast.classList.remove('show');
      setTimeout(() => toast.classList.remove('show'), 18000);
    }

    // Inicializa panel por defecto
    renderPanels();

    // ---------- Modal Top 5: open/close ----------
    document.addEventListener("DOMContentLoaded", () => {
      const top5Modal = document.getElementById("top5Modal");
      const closeTop5 = document.getElementById("closeTop5");
      if (closeTop5) closeTop5.onclick = () => top5Modal.classList.add("hidden");
      document.body.addEventListener("click", e => { if (e.target === top5Modal) top5Modal.classList.add("hidden"); });
    });

    // ---------- Top 5 logic (único handler) ----------
    document.addEventListener("click", function(e) {
      if (e.target && e.target.id === "btnTop5") {
        const client = state.currentClient;
        const root = document.querySelector(`.clientPanel[data-client="${client}"]`);
        const rows = getFilteredRows(client, root);

        // Agrupa por refTeix (BV). Si no hay BV, usa refCli. Para MCI, usa r.ref
        const piezas = {};
        rows.forEach(r => {
          const key = r.refTeix || r.refCli || r.ref || "";
          if (!key) return;
          piezas[key] = (piezas[key] || 0) + (Number(r.qty) || 0);
        });

        const top5 = Object.entries(piezas)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);

        const top5List = document.getElementById("top5List");
        top5List.innerHTML = "";

        top5.forEach(([refBV, qty], idx) => {
          const row = rows.find(r => (r.refTeix || r.refCli || "") === refBV);
          const refClienteT = row?.refCli || "-"; // viene de columna T si existe

          const div = document.createElement("div");
          div.className = "flex flex-col items-center gap-2 p-4 border rounded-xl shadow-glow bg-white dark:bg-gray-800";

          div.innerHTML = `
            <div class='text-lg font-bold mb-2'>${idx + 1}. ${refBV}</div>
            <div class='text-xs text-gray-600 -mt-1 mb-2'>
              Ref. cliente (T): <b>${refClienteT}</b>
            </div>
            <div class='text-2xl font-extrabold text-brand-700 mb-2'>
              ${qty.toLocaleString()}
            </div>
            <div class='top5-3d' id='top5-3d-${idx}' style='width:180px;height:180px;background:#f3f4f6;border-radius:1rem;'></div>
            <div class='text-xs text-gray-500 mt-1 font-mono'>
              STL: <span id='stl-name-${idx}'>${refBV}.stl</span>
            </div>
          `;

          top5List.appendChild(div);
          setTimeout(() => renderTop5Model(refBV, `top5-3d-${idx}`), 100);
        });

        document.getElementById("top5Modal").classList.remove("hidden");
      }
    });

    // --- Renderizar 3D con stl_viewer ---
    const top5Viewers = {};

    async function stlExists(url){
      try{
        const res = await fetch(url, { method:'HEAD', cache:'no-store' });
        return res.ok;
      }catch{ return false; }
    }

    function buildStlCandidates(ref){
      const basePaths = ['/static/stl/', 'static/stl/'];
      const names = new Set([
        ref,
        String(ref).trim(),
        String(ref).toUpperCase(),
        String(ref).toLowerCase(),
        String(ref).replace(/\s+/g,'_'),
        String(ref).replace(/\s+/g,'-')
      ]);
      const exts = ['.stl', '.STL'];
      const cands = [];
      for(const bp of basePaths){
        for(const n of names){
          for(const ext of exts){
            cands.push(`${bp}${n}${ext}`);
          }
        }
      }
      return [...new Set(cands)];
    }

    async function resolveStlPath(ref){
      const cands = buildStlCandidates(ref);
      for(const url of cands){
        if(await stlExists(url)) return url;
      }
      return null;
    }

    async function renderTop5Model(ref, containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = "";
      try {
        if (top5Viewers[containerId] && typeof top5Viewers[containerId].dispose === 'function') {
          top5Viewers[containerId].dispose();
        }
      } catch {}

      const stlPath = await resolveStlPath(ref);
      const stlNameSpan = container.parentElement && container.parentElement.querySelector('span[id^="stl-name-"]');
      if(!stlPath){
        container.innerHTML = "<div class='small text-center text-gray-400'>No hay modelo 3D disponible.</div>";
        if (stlNameSpan) stlNameSpan.textContent = ref + ".stl";
        return;
      }
      if (stlNameSpan) stlNameSpan.textContent = stlPath.split('/').pop();

      const initViewer = () => {
        try {
          top5Viewers[containerId] = new StlViewer(container, {
            auto_rotate: true,
            models: [ { filename: stlPath, color: "#0071bc" } ]
          });
        } catch (err) {
          container.innerHTML = "<div class='small text-center text-gray-400'>No hay modelo 3D disponible.</div>";
        }
      };
      if (!window.StlViewer) {
        const s = document.createElement('script');
        s.src = (window.stl_viewer_script_path || '') + 'stl_viewer.min.js';
        s.onload = initViewer;
        s.onerror = () => {
          container.innerHTML = "<div class='small text-center text-gray-400'>No hay modelo 3D disponible.</div>";
        };
        document.body.appendChild(s);
      } else {
        initViewer();
      }
    }
  </script>
