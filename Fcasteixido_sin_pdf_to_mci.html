            }
          }
          if (!anio || !mes || !(fecha instanceof Date) || isNaN(fecha)) return;
          const nqty = Number(qty||0);
          const refClean = (effectiveRef||'').toString().replace(/[^A-Za-z0-9/_\-.]+$/,'') || null;
          rows.push({ cliente:'MCI', fecha, anio, mes, ref: refClean || null, planta: null, qty: nqty });
        });

        state.mciRows = rows;

        // Cambiar a MCI y re-render
        state.currentClient = 'MCI';
        document.querySelectorAll('.clientTab').forEach(b=>{
          const isMci = b.dataset.client==='MCI';
          b.classList.toggle('bg-gray-100', isMci);
          b.classList.toggle('dark:bg-gray-800', isMci);
        });
        renderPanels();
      } catch (err) {
        console.error('Error leyendo PDF MCI:', err);
        alert('No se pudo leer el PDF de MCI. Revisa que el PDF sea vectorial.');
      }
    }

    // ===== Utilidades de parsing PDF MCI =====
    function mciNormalizeDateLike(s) {
      const raw = (s || '').trim(); if (!raw) return raw;
      const t = raw.replace(/^[^0-9]+/, '');
      let m = t.match(/^(\d{1,2})[.\-_\/](\d{1,2})[.\-_\/](\d{2}|\d{4})$/);
      if (m) {
        let [ , dd, mm, yy ] = m;
        let yyyy = yy.length === 2 ? (parseInt(yy,10) >= 70 ? `19${yy}` : `20${yy}`) : yy;
        const d = new Date(parseInt(yyyy,10), parseInt(mm,10)-1, parseInt(dd,10));
        if (!isNaN(d.getTime())) return d;
        return `${String(dd).padStart(2,'0')}/${String(mm).padStart(2,'0')}/${yyyy}`;
      }
      m = t.match(/^(\d{1,2})[.\-_\/](\d{4})$/);
      if (m) {
        const mm = String(m[1]).padStart(2,'0'); const yyyy = m[2];
        return `${mm}/${yyyy}`;
      }
      return t;
    }
    function mciIsDateToken(s){
      const raw = String(s||'').trim().replace(/^[^0-9]+/, '');
      return /^(\d{1,2})[.\-_\/](\d{1,2})[.\-_\/](\d{2}|\d{4})$/.test(raw) || /^(\d{1,2})[.\-_\/](\d{4})$/.test(raw);
    }
    function mciGroupByRowY(items, yTol){
      const sorted = items.slice().sort((a,b)=> b.y - a.y);
      const rows = []; let current = [];
      const flush = ()=>{ if (current.length){ current.sort((a,b)=> a.x - b.x); rows.push(current); current=[]; } };
      for (let i=0;i<sorted.length;i++){
        const it = sorted[i];
        if (!current.length) current.push(it);
        else { const lastY = current[0].y; if (Math.abs(it.y - lastY) <= yTol) current.push(it); else { flush(); current.push(it); } }
      }
      flush(); return rows;
    }
    function mciRoughSimilarPct(a,b){ if(a===b) return 100; if(a.startsWith(b)||b.startsWith(a)) return 90; if(a.includes(b)||b.includes(a)) return 80; return 0; }
    function mciFindHeaderRow(items, headers, { yTol, headerMinPct }){
      const rows = mciGroupByRowY(items, yTol); const targets = headers.map(h=>h.toLowerCase()); let best=null;
      for(const row of rows){
        const matches=[]; for(const it of row){ const s=it.str.toLowerCase(); for(let i=0;i<targets.length;i++){ const pct=mciRoughSimilarPct(s,targets[i]); if(pct>=headerMinPct) matches.push({i,it}); } }
        const setIdx=new Set(matches.map(m=>m.i)); if (setIdx.size>=3){
          const perCol=Array(headers.length).fill(null); for(const m of matches){ if(!perCol[m.i]) perCol[m.i]=[]; perCol[m.i].push(m.it); }
          const colXs=[]; for(let i=0;i<headers.length;i++){ if(perCol[i]&&perCol[i].length){ const chosen=perCol[i].slice().sort((a,b)=>a.x-b.x)[0]; colXs.push({idx:i,x:chosen.x,item:chosen}); } else { colXs.push({idx:i,x:null,item:null}); } }
          const avgY=row.reduce((acc,it)=>acc+it.y,0)/row.length; const found={avgY,colXs}; const count=colXs.filter(c=>c.x!=null).length; if(!best||count>best.count) best={...found,count};
        }
      }
      if(!best||best.count<2) return null; return best;
    }
    function mciComputeColumnRanges(hdr){
      const xs=Array(4).fill(null); for(const c of hdr.colXs){ if(c.x!=null) xs[c.idx]=c.x; }
      if (xs[1]==null && xs[0]!=null && xs[2]!=null) xs[1]=(xs[0]+xs[2])/2;
      if (xs[2]==null && xs[1]!=null && xs[3]!=null) xs[2]=(xs[1]+xs[3])/2;
      for(let i=0;i<4;i++){ if(xs[i]==null){ for(let step=1;step<4;step++){ const left=i-step,right=i+step; if(left>=0&&xs[left]!=null){ xs[i]=xs[left]+120*step; break; } if(right<4&&xs[right]!=null){ xs[i]=xs[right]-120*step; break; } } } }
      const mids=[(xs[0]+xs[1])/2,(xs[1]+xs[2])/2,(xs[2]+xs[3])/2]; const minX=Math.min(...xs)-60; const maxX=Math.max(...xs)+60;
      return [[minX,mids[0]],[mids[0],mids[1]],[mids[1],mids[2]],[mids[2],maxX]];
    }
    function mciWhichColumn(cx,ranges){ for(let i=0;i<ranges.length;i++){ const [a,b]=ranges[i]; if(cx>=a&&cx<b) return i; } return -1; }
    function mciPdfExtract(items, { yTol, headerMinPct, recalcEach, lastColRanges, headers }){
      const materialRef = mciExtractMaterialRefFromItems(items);
      let hdrInfo=null, colRanges=null;
      if (recalcEach || !lastColRanges) {
        hdrInfo = mciFindHeaderRow(items, headers, { yTol, headerMinPct });
        colRanges = hdrInfo ? mciComputeColumnRanges(hdrInfo) : lastColRanges;
      } else { colRanges = lastColRanges; }
      if (!colRanges) return { rows: [], meta: { colRanges:null } };
      const cutoffY = (hdrInfo && hdrInfo.avgY != null) ? hdrInfo.avgY : Infinity;
      const below = items.filter(it => it.y < cutoffY - yTol);
      const groupedRows = mciGroupByRowY(below, yTol);
      const rows = [];
      for (const row of groupedRows) {
        const cols = ["","","",""];
        for (const it of row) {
          const cx = it.x + it.width/2; const idx = mciWhichColumn(cx, colRanges);
          if (idx !== -1) cols[idx] = cols[idx] ? (cols[idx] + " " + it.str) : it.str;
        }
        const merged = cols.map(v => (v||"").trim());
        const isHeaderRepeat = merged.every((v,i)=> v.toLowerCase().includes(headers[i].toLowerCase()));
        const isEmpty = merged.every(v => !v);
        if (isEmpty || isHeaderRepeat) continue;
        if (!mciIsDateToken(merged[0])) continue;
        const toNum = (s)=>{ const cleaned=String(s||"").replace(/\s+/g,'').replace(/,/g,''); if(cleaned==="") return s; const n=Number(cleaned); return isNaN(n)? s : n; };
        const q = toNum(merged[1]); const ch = toNum(merged[2]); const cum = toNum(merged[3]);
        const anyNumber = [q,ch,cum].some(v => typeof v === 'number' && !isNaN(v)); if (!anyNumber) continue;
        const dateOut = mciNormalizeDateLike(merged[0]);
        rows.push([dateOut, q, ch, cum, materialRef]);
      }
      return { rows, meta: { colRanges } };
    }

    function mciExtractMaterialRefFromItems(items){
      try {
        const pageText = items.map(it=>it.str).join(' ');
        const pageTextLC = pageText.toLowerCase();
        // Buscar la ventana de texto tras la palabra "material"
        const idx = pageTextLC.indexOf('material');
        const windowText = idx >= 0 ? pageText.slice(idx, idx + 160) : pageText;
        // Acepta solo patrones numéricos tipo 280/506-00 (flexible en longitudes)
        const reNum = /\b\d{1,6}\/\d{1,6}(?:-\d{1,6})?\b/;
        const m = windowText.match(reNum);
        if (m && m[0]) return m[0];
      } catch {}
      return null;
    }

    function parseExcelDate(v){
      if(v==null) return null;
      if(typeof v === 'number'){
        const o = XLSX.SSF.parse_date_code(v);
        if(!o) return null;
        return new Date(Date.UTC(o.y, o.m-1, o.d, o.H||0, o.M||0, o.S||0));
      }
      if(typeof v==='string'){
        const t1 = /^\d{4}-\d{2}-\d{2}/.test(v) ? new Date(v) : NaN;
        if(!isNaN(t1)) return t1;
        const m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
        if(m){
          const dd=+m[1], mm=+m[2]-1, yy=m[3].length===2? 2000+ +m[3] : +m[3];
          return new Date(Date.UTC(yy,mm,dd));
        }
      }
      const d = new Date(v);
      return isNaN(d)? null : d;
    }

    // ===== Helpers para Crear Excel (Delfor -> Forecast) =====
    function colLetterToIndex(letter){
      let n = 0; const s = String(letter||'').trim().toUpperCase();
      for (let i=0;i<s.length;i++){ n = n*26 + (s.charCodeAt(i)-64); }
      return n; // 1-based
    }
    function colIndexToLetter(n){
      let s=''; let x=n; while (x>0){ const m=(x-1)%26; s = String.fromCharCode(65+m)+s; x = Math.floor((x-1)/26); } return s;
    }
    function wsRange(ws){ const ref = ws['!ref']; if(!ref) return null; return XLSX.utils.decode_range(ref); }
    function lastUsedRowInCol(ws, colLetter){
      const c = colLetterToIndex(colLetter) - 1; const r = wsRange(ws); if (!r) return 0;
      for (let row=r.e.r; row>=0; row--){ const addr = XLSX.utils.encode_cell({r: row, c}); if (ws[addr] && ws[addr].v !== undefined && ws[addr].v !== '') return row+1; }
      return 0;
    }
    function ensureRange(ws, r){ ws['!ref'] = XLSX.utils.encode_range(r); }
    function clearRange(ws, c1, r1, c2, r2){
      for (let R=r1; R<=r2; R++){
        for (let C=c1; C<=c2; C++){
          const addr = XLSX.utils.encode_cell({r:R,c:C});
          if (ws[addr]) delete ws[addr];
        }
      }
    }
    function setCell(ws, r1based, c1based, val, type){
      const r = r1based-1, c = c1based-1; const addr = XLSX.utils.encode_cell({r, c});
      ws[addr] = ws[addr] || {};
      ws[addr].v = val;
      if (type) ws[addr].t = type;
    }
    function excelSerialToDateString(n){
      if (typeof n !== 'number' || !isFinite(n)) return null;
      const days = Math.floor(n);
      const epoch = new Date(Date.UTC(1899, 11, 30));
      const d = new Date(epoch.getTime() + days * 86400000);
      const dd = String(d.getUTCDate()).padStart(2,'0');
      const mm = String(d.getUTCMonth()+1).padStart(2,'0');
      const yyyy = String(d.getUTCFullYear());
      return `${dd}/${mm}/${yyyy}`;
    }
    function dateToExcelSerial(d){
      if (!(d instanceof Date) || isNaN(d)) return null;
      const epoch = Date.UTC(1899, 11, 30);
      const ts = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
      return Math.round((ts - epoch) / 86400000);
    }
    function normalizeDateCells(ws, letters){
      const r = wsRange(ws); if(!r) return;
      const targets = new Set();
      (letters||[]).forEach(l=>{ if(l) targets.add(colLetterToIndex(l)); });
      const startRow = r.s.r + 1; // fila 2
      for (const c1based of targets){
        for (let rr=startRow; rr<=r.e.r; rr++){
          const addr = XLSX.utils.encode_cell({r: rr, c: c1based-1});
          const cell = ws[addr];
          if (!cell) continue;
          if (typeof cell.v === 'string'){
            const s0 = String(cell.v).replace(/\u00A0/g,'').trim();
            const s = s0.includes('.') ? s0.replaceAll('.', '/') : s0;
            const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
            if (m){
              const dd=+m[1], mm=+m[2], yy=m[3].length===2? 2000+ +m[3] : +m[3];
              const d = new Date(Date.UTC(yy, mm-1, dd));
              const dd2 = String(d.getUTCDate()).padStart(2,'0');
              const mm2 = String(d.getUTCMonth()+1).padStart(2,'0');
              const yyyy2 = String(d.getUTCFullYear());
              cell.v = `${dd2}/${mm2}/${yyyy2}`; cell.t = 's'; continue;
            }
          } else if (typeof cell.v === 'number'){
            const dstr = excelSerialToDateString(cell.v);
            if (dstr){ cell.v = dstr; cell.t = 's'; continue; }
          }
        }
      }
    }

    // ===== Progreso en tiempo real =====
    function ensureProgressUI(){
      const panel = document.getElementById('progressPanel');
      if (!panel) return null;
      const btn = panel.querySelector('#progressClose');
      if (btn && !btn._bound){ btn._bound = true; btn.onclick = ()=> panel.style.display='none'; }
      return panel;
    }
    function progressShow(title){ const panel = ensureProgressUI(); if (!panel) return; panel.style.display='block'; document.getElementById('progressTitle').textContent = title||'Procesando…'; progressSet(0); progressClear(); }
    function progressHide(){ const panel = document.getElementById('progressPanel'); if (panel) panel.style.display='none'; }
    function progressSet(pct){ const el = document.getElementById('progressBar'); if (el) el.style.width = Math.max(0, Math.min(100, pct||0)) + '%'; }
    function progressLog(msg){ const el = document.getElementById('progressLog'); if (!el) return; const t = new Date(); const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`; el.insertAdjacentHTML('beforeend', `<div>[${ts}] ${msg}</div>`); el.scrollTop = el.scrollHeight; }
    function progressClear(){ const el = document.getElementById('progressLog'); if (el) el.innerHTML=''; }
    async function progressYield(){ await new Promise(r=> setTimeout(r, 0)); }

    // Construye una hoja 'Last LAR' nueva con solo el pegado B2..BTn a partir del Delfor
    function buildLastLARSheetFromDelfor(delforWb){
      const wsSrc = delforWb.Sheets[delforWb.SheetNames[0]];
      normalizeDateCells(wsSrc, ['AK','BT']);
      const wsOut = {};
      const maxColCopy = 'BT';
      const delforLR = lastUsedRowInCol(wsSrc, 'A');
      const maxColIdx = colLetterToIndex(maxColCopy);
      // Rellenar B2..BU{n}
      if (delforLR >= 2){
        for (let R=2; R<=delforLR; R++){
          for (let srcC=1; srcC<=maxColIdx; srcC++){
            const dstC = srcC + 1; // B..
            const addr = XLSX.utils.encode_cell({r:R-1,c:srcC-1});
            const cell = wsSrc[addr]; if (!cell) continue;
            let v = cell.v;
            if (srcC === colLetterToIndex('AK') || srcC === colLetterToIndex('BT')){
              if (typeof v === 'string'){
                const s = v.replace(/\u00A0/g,'').trim();
                if (s.includes('.')) v = s.replaceAll('.', '/');
                else if (/^\d{4,6}([,.]\d+)?$/.test(s)){
                  const num = Number(s.replace(',','.'));
                  const dstr = isNaN(num)? null : excelSerialToDateString(num);
                  if (dstr) v = dstr;
                }
              } else if (typeof v === 'number'){
                const dstr = excelSerialToDateString(v); if (dstr) v = dstr;
              }
            }
            const outAddr = XLSX.utils.encode_cell({r:R-1, c: dstC-1});
            wsOut[outAddr] = { t: (typeof v==='number'?'n':'s'), v };
          }
        }
      }
      const r = { s: {r:1, c:1}, e: { r: Math.max(1, delforLR-1), c: colLetterToIndex(maxColCopy) } };
      wsOut['!ref'] = XLSX.utils.encode_range(r);
      return wsOut;
    }

    async function runCreateExcel(delforFile, forecastFile){
      try{
        const maxColCopy = 'BT';
        // Leer Delfor (CSV/XLSX)
        let delforWb;
        if (/\.csv$/i.test(delforFile.name)){
          const txt = await delforFile.text();
          delforWb = XLSX.read(txt, { type: 'string' });
        } else {
          const ab = await delforFile.arrayBuffer();
          delforWb = XLSX.read(ab, { type: 'array' });
        }
        const delforWS = delforWb.Sheets[delforWb.SheetNames[0]];
        normalizeDateCells(delforWS, ['AK','BT']);

        // Leer Forecast
        const abForecast = await forecastFile.arrayBuffer();
        const fw = XLSX.read(abForecast, { type: 'array' });
        const wsLast = fw.Sheets['Last LAR'] || fw.Sheets[fw.SheetNames[0]];
        if (!wsLast) { alert('No se encontró la hoja Last LAR'); return; }

        // Limpiar B2:BT{lastPrev}
        const lastPrev = lastUsedRowInCol(wsLast, 'B');
        const c1 = colLetterToIndex('B')-1; const c2 = colLetterToIndex('BT')-1;
        if (lastPrev >= 2) clearRange(wsLast, c1, 1, c2, lastPrev-1);

        // Copiar A2:BTn -> B2:...
        const delforLR = lastUsedRowInCol(delforWS, 'A');
        const maxColIdx = colLetterToIndex(maxColCopy);
        if (delforLR >= 2){
          for (let R=2; R<=delforLR; R++){
            for (let srcC=1; srcC<=maxColIdx; srcC++){
              const dstC = srcC + 1;
              const addr = XLSX.utils.encode_cell({r:R-1,c:srcC-1});
              const cell = delforWS[addr];
              if (!cell) continue;
              let v = cell.v;
              if (srcC === colLetterToIndex('AK') || srcC === colLetterToIndex('BT')){
                if (typeof v === 'string'){
                  const s = v.replace(/\u00A0/g,'').trim();
                  if (s.includes('.')) v = s.replaceAll('.', '/');
                  else if (/^\d{4,6}([,.]\d+)?$/.test(s)){
                    const num = Number(s.replace(',','.')); const dstr = isNaN(num)? null : excelSerialToDateString(num); if (dstr) v = dstr;
                  }
                } else if (typeof v === 'number'){
                  const dstr = excelSerialToDateString(v); if (dstr) v = dstr;
                }
              }
              const t = (typeof v === 'number') ? 'n' : 's';
              setCell(wsLast, R, dstC, v, t);
            }
          }
        }

        const newLast = lastUsedRowInCol(wsLast, 'B');
        if (newLast < lastPrev){
          const cStart = colLetterToIndex('B')-1;
          const cEnd = colLetterToIndex(maxColCopy)-1;
          if (newLast+1 <= lastPrev) clearRange(wsLast, cStart, newLast, cEnd, lastPrev-1);
        }
        const r = wsRange(wsLast) || { s: {r:0,c:0}, e: {r:0,c:0} };
        r.e.r = Math.max(r.e.r, newLast-1);
        r.e.c = Math.max(r.e.c, colLetterToIndex(maxColCopy)-1);
        ensureRange(wsLast, r);

  const outName = buildSafeOutName(forecastFile.name);
  XLSX.writeFile(fw, outName);
      } catch (err){
        console.error('Crear Excel error:', err);
        alert('Error creando el Excel actualizado: ' + err.message);
      }
    }

    // Utilidades para nombres de archivo seguros en Windows
    function buildSafeOutName(originalName){
      const removeExt = (n)=> n.replace(/\.[^.]+$/,'');
      const sanitize = (n)=>{
        let s = (n||'').replace(/[\\\/:*?"<>|]/g,'-').replace(/[\x00-\x1F\x7F]/g,'');
        s = s.replace(/\s+/g,' ').trim();
        s = s.replace(/[ .]+$/,'');
        if (!s) s = 'Forecast';
        // cap length to avoid OS/path quirks
        if (s.length > 150) s = s.slice(0,150);
        return s;
      };
      const ts = new Date();
      const stamp = `${ts.getFullYear()}-${String(ts.getMonth()+1).padStart(2,'0')}-${String(ts.getDate()).padStart(2,'0')} ${String(ts.getHours()).padStart(2,'0')}-${String(ts.getMinutes()).padStart(2,'0')}-${String(ts.getSeconds()).padStart(2,'0')}`;
      const base = sanitize(removeExt(originalName||'')) || `Forecast ${stamp}`;
      const out = `${base} - actualizado.xlsx`;
      return out.replace(/[\\\/:*?"<>|]/g,'-').replace(/[ .]+$/,'');
    }

    // Pega solo B2..BU en hoja Last LAR dentro del XLSX original, preservando tablas/relaciones
    async function runCreateExcelPreserve(delforFile, forecastFile){
      // Copiar todo el contenido desde A2 (todas las columnas presentes) y pegar en B2
      // 1) Leer Delfor a matriz y normalizar AK/BT
      progressShow('Descargar Forecast actualizado');
      progressLog('Leyendo Delfor…');
      let dWb;
      if (/\.csv$/i.test(delforFile.name)){
        const txt = await delforFile.text(); dWb = XLSX.read(txt, { type: 'string' });
      } else { const ab = await delforFile.arrayBuffer(); dWb = XLSX.read(ab, { type: 'array' }); }
      const dWS = dWb.Sheets[dWb.SheetNames[0]];
      progressLog('Normalizando fechas (AK, BT)…');
      normalizeDateCells(dWS, ['AK','BT']);
      // Dimensionado robusto usando AOA (evita rangos gigantes por estilos)
      const aoa = XLSX.utils.sheet_to_json(dWS, { header: 1, raw: true });
      // aoa es 0-based; fila 0 suele ser cabecera; copiamos desde fila 1 (A2)
      const lastDataRow = (()=>{
        for (let r = aoa.length - 1; r >= 1; r--) {
          const row = aoa[r] || [];
          if (row.some(v => v !== null && v !== undefined && String(v).trim() !== '')) return r + 1; // a 1-based index
        }
        return 1; // solo cabecera
      })();
      const lastDataCol = (()=>{
        let max = 0;
        for (let r = 1; r < aoa.length; r++) {
          const row = aoa[r] || [];
          for (let c = row.length - 1; c >= 0; c--) {
            const v = row[c];
            if (v !== null && v !== undefined && String(v).trim() !== '') { max = Math.max(max, c + 1); break; }
          }
        }
        return Math.max(1, max);
      })();
      progressLog(`Rango a pegar: filas 2..${lastDataRow}, columnas A..${colIndexToLetter(lastDataCol)}`);

      // 2) Cargar Forecast ZIP
      progressSet(10); progressLog('Leyendo Forecast (ZIP XLSX)…');
      const fBuf = await forecastFile.arrayBuffer();
      const zip = await JSZip.loadAsync(fBuf);
      const readText = async p => zip.file(p)?.async('string');
      const MAIN_NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
      const REL_NS = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
      const wbXmlPath = 'xl/workbook.xml';
      const wbRelsPath = 'xl/_rels/workbook.xml.rels';
      const wbXml = await readText(wbXmlPath);
      const relXml = await readText(wbRelsPath);
      if (!wbXml || !relXml) { alert('El Forecast no es un XLSX válido'); progressHide(); return; }
      const p = new DOMParser();
      const wbDoc = p.parseFromString(wbXml, 'application/xml');
      const relDoc = p.parseFromString(relXml, 'application/xml');

      // 3) Encontrar sheet por nombre (robusto, case-insensitive y trim)
      progressLog('Localizando hoja "Last LAR"…');
      const sheets = wbDoc.getElementsByTagNameNS(MAIN_NS, 'sheet');
      let sheetId = null;
      const norm = (s)=> String(s||'').trim().toLowerCase();
      for (const s of sheets){
        const nm = s.getAttribute('name');
        if (norm(nm) === 'last lar') { sheetId = s.getAttributeNS(REL_NS,'id') || s.getAttribute('r:id'); break; }
      }
      if (!sheetId){
        // fallback: primera hoja
        const first = sheets[0]; if (!first) { alert('No hay hojas en Forecast'); progressHide(); return; }
        sheetId = first.getAttributeNS(REL_NS,'id') || first.getAttribute('r:id');
        progressLog('No se halló "Last LAR"; usando la primera hoja.');
      }
      if (!sheetId) { alert('No se pudo localizar la hoja Last LAR'); progressHide(); return; }

      // 4) Mapear rel Id -> target
      progressLog('Cargando XML de la hoja…');
      const rels = relDoc.getElementsByTagName('Relationship');
      let target = null;
      for (const r of rels){ if (r.getAttribute('Id') === sheetId){ target = r.getAttribute('Target'); break; } }
      if (!target){ alert('No se encontró el XML de la hoja'); progressHide(); return; }
      const sheetPath = target.startsWith('xl/') ? target : ('xl/' + target);
      const sheetXml = await readText(sheetPath);
      if (!sheetXml){ alert('No se pudo leer la hoja'); progressHide(); return; }
      const sheetDoc = p.parseFromString(sheetXml, 'application/xml');
      const sheetData = sheetDoc.getElementsByTagNameNS(MAIN_NS, 'sheetData')[0];
      if (!sheetData){ alert('Hoja sin sheetData'); progressHide(); return; }
      // Intentar localizar las tablas vinculadas a la hoja (para extender su ref más tarde)
      const sheetRelPath = sheetPath.replace(/(.*\/(?:))([^\/]+)$/,'$1_rels/$2.rels');
      let sheetTables = [];
      try{
        const sheetRelsXml = await readText(sheetRelPath);
        if (sheetRelsXml){
          const sheetRelsDoc = p.parseFromString(sheetRelsXml, 'application/xml');
          const tRels = [...sheetRelsDoc.getElementsByTagName('Relationship')]
            .filter(n=> (n.getAttribute('Type')||'').includes('/table'));
          const baseDir = sheetPath.substring(0, sheetPath.lastIndexOf('/')+1);
          const normPath = (base, rel)=>{
            if (!rel) return null;
            if (rel.startsWith('/')) return rel.replace(/^\//,'');
            let full = base + rel;
            full = full.replace('/worksheets/../','/');
            return full;
          };
          sheetTables = tRels.map(n=> ({ id: n.getAttribute('Id'), path: normPath('xl/', n.getAttribute('Target')) }));
        }
      }catch{}

      // helpers XML
      function getOrCreateRow(rIdx){
        const rows = sheetData.getElementsByTagNameNS(MAIN_NS, 'row');
        for (const row of rows){ if (Number(row.getAttribute('r')) === rIdx) return row; }
        const row = sheetDoc.createElementNS(MAIN_NS, 'row'); row.setAttribute('r', String(rIdx));
        // insert in order
        let inserted = false;
        for (let i=0;i<rows.length;i++){ const rr = Number(rows[i].getAttribute('r')); if (rIdx < rr){ sheetData.insertBefore(row, rows[i]); inserted = true; break; } }
        if (!inserted) sheetData.appendChild(row);
        return row;
      }
      function setCellValue(rowEl, cellRef, val, styleId){
        // find existing
        const cells = rowEl.getElementsByTagNameNS(MAIN_NS, 'c');
        let cEl = null;
        for (const c of cells){ if (c.getAttribute('r') === cellRef){ cEl = c; break; } }
        if (!cEl){
          // create and insert in order by column index
          cEl = sheetDoc.createElementNS(MAIN_NS, 'c');
          cEl.setAttribute('r', cellRef);
          const targetCol = colLetterToIndex(cellRef.replace(/\d+$/, ''));
          let inserted = false;
          for (const existing of cells){
            const er = existing.getAttribute('r')||'';
            const ecol = colLetterToIndex(er.replace(/\d+$/, ''));
            if (ecol > targetCol){ rowEl.insertBefore(cEl, existing); inserted = true; break; }
          }
          if (!inserted) rowEl.appendChild(cEl);
        }
        // clear children/type
        while (cEl.firstChild) cEl.removeChild(cEl.firstChild);
        cEl.removeAttribute('t');
        if (styleId != null && !cEl.hasAttribute('s')){ cEl.setAttribute('s', String(styleId)); }
        if (val === null || val === undefined || val === '') return; // leave blank
        // Decide tipo: solo números reales como number; el resto inlineStr para evitar reparaciones
        if (typeof val === 'number'){
          const v = sheetDoc.createElementNS(MAIN_NS, 'v'); v.textContent = String(val); cEl.appendChild(v);
        } else {
          const sval = String(val);
          const numMatch = sval.match(/^[-+]?(?:\d+)(?:[.,]\d+)?$/);
          const hasLeadingZero = /^0\d+/.test(sval);
          if (numMatch && !hasLeadingZero){
            const num = Number(sval.replace(',','.'));
            if (!Number.isNaN(num)){
              const v = sheetDoc.createElementNS(MAIN_NS, 'v'); v.textContent = String(num); cEl.appendChild(v);
            } else {
              cEl.setAttribute('t','inlineStr');
              const isEl = sheetDoc.createElementNS(MAIN_NS, 'is');
              const tEl = sheetDoc.createElementNS(MAIN_NS, 't'); tEl.textContent = sval; isEl.appendChild(tEl); cEl.appendChild(isEl);
            }
          } else {
            cEl.setAttribute('t','inlineStr');
            const isEl = sheetDoc.createElementNS(MAIN_NS, 'is');
            const tEl = sheetDoc.createElementNS(MAIN_NS, 't'); tEl.textContent = sval; isEl.appendChild(tEl); cEl.appendChild(isEl);
          }
        }
      }

      // 5) Pegar A2:..n (todas las columnas con datos) -> B2:..
  const lastRow = lastDataRow;          // 1-based
  const maxIdx = lastDataCol;           // 1-based (A=1)
      progressLog('Pegando datos en Forecast…');
      const akIdx = colLetterToIndex('AK');
      const btIdx = colLetterToIndex('BT');
      function findStyleIdForColumn(colLetter){
        const cs = sheetDoc.getElementsByTagNameNS(MAIN_NS, 'c');
        for (let i=0;i<cs.length;i++){
          const r = cs[i].getAttribute('r')||'';
          if (r.startsWith(colLetter)){
            const s = cs[i].getAttribute('s'); if (s!=null) return Number(s);
          }
        }
        return null;
      }
      const destAkColLetter = colIndexToLetter(akIdx + 1);
      const destBtColLetter = colIndexToLetter(btIdx + 1);
      const akStyleId = findStyleIdForColumn(destAkColLetter);
      const btStyleId = findStyleIdForColumn(destBtColLetter);
      for (let R=2; R<=lastRow; R++){
        const row = getOrCreateRow(R);
        const rowArr = aoa[R-1] || [];
        for (let srcC=1; srcC<=maxIdx; srcC++){
          const dstC = srcC + 1;
          let v = rowArr[srcC-1];
          if (srcC === akIdx || srcC === btIdx){
            // Normalize to dd/mm/yyyy then write as Excel date serial
            let d = null;
            if (typeof v === 'string'){
              let s = v.replace(/\u00A0/g,'').trim();
              if (s.includes('.')) s = s.replaceAll('.', '/');
              d = parseExcelDate(s);
            } else if (typeof v === 'number'){
              d = parseExcelDate(v);
            }
            const serial = d ? dateToExcelSerial(d) : null;
            if (serial != null) v = serial;
          }
          const cellRef = colIndexToLetter(dstC) + String(R);
          const styleId = (dstC === akIdx + 1) ? akStyleId : (dstC === btIdx + 1 ? btStyleId : null);
          setCellValue(row, cellRef, v, styleId);
        }
        if ((R % 500) === 0 || R === lastRow) {
          const pct = 10 + Math.round(((R-1)/(lastRow-1||1))*80);
          progressSet(pct);
          progressLog(`Pegadas ${R-1} filas de ${lastRow-1}`);
          await progressYield();
        }
      }

      // 6) Ajustar dimensión del sheet para que Excel reconozca el rango usado
      try {
  const worksheetEl = sheetDoc.getElementsByTagNameNS(MAIN_NS, 'worksheet')[0];
  const dimRef = 'A1:' + colIndexToLetter(maxIdx + 1) + String(lastRow);
        let dimEl = sheetDoc.getElementsByTagNameNS(MAIN_NS, 'dimension')[0];
        if (!dimEl) {
          dimEl = sheetDoc.createElementNS(MAIN_NS, 'dimension');
          dimEl.setAttribute('ref', dimRef);
          if (worksheetEl.firstChild) worksheetEl.insertBefore(dimEl, worksheetEl.firstChild);
          else worksheetEl.appendChild(dimEl);
        } else {
          dimEl.setAttribute('ref', dimRef);
        }
        progressLog('Dimension ajustada a ' + dimRef);
      } catch(e) { /* ignore */ }

      // 6.b) Extender rangos de tablas vinculadas a la hoja, si existen
      try{
        for (const t of sheetTables){
          if (!t.path) continue;
          const tXml = await readText(t.path);
          if (!tXml) continue;
          const tDoc = p.parseFromString(tXml, 'application/xml');
          const tEl = tDoc.getElementsByTagName('table')[0];
          if (!tEl) continue;
          const ref = tEl.getAttribute('ref')||'';
          const m = ref.match(/^([A-Z]+)(\d+):([A-Z]+)(\d+)$/i);
          if (!m) continue;
          const startCol = m[1], startRow = parseInt(m[2],10);
          const endCol = m[3], endRow = parseInt(m[4],10);
          const newEndRow = Math.max(endRow, lastRow);
          const newRef = `${startCol}${startRow}:${endCol}${newEndRow}`;
          if (newRef !== ref){
            tEl.setAttribute('ref', newRef);
            const af = tDoc.getElementsByTagName('autoFilter')[0];
            if (af) af.setAttribute('ref', newRef);
            const ser = new XMLSerializer();
            const newTXml = ser.serializeToString(tDoc);
            zip.file(t.path, newTXml);
            progressLog(`Tabla actualizada: ${ref} → ${newRef}`);
          }
        }
      }catch(e){ /* ignore */ }

      // 6.c) Forzar recálculo completo al abrir
      try{
        let calc = wbDoc.getElementsByTagNameNS(MAIN_NS, 'calcPr')[0];
        if (!calc){ calc = wbDoc.createElementNS(MAIN_NS, 'calcPr'); wbDoc.documentElement.appendChild(calc); }
        calc.setAttribute('fullCalcOnLoad','1');
        const serWb = new XMLSerializer();
        zip.file(wbXmlPath, serWb.serializeToString(wbDoc));
        progressLog('Recalc forzado al abrir habilitado.');
      }catch{}

      // 6) Ajustar dimensión del sheet para que Excel reconozca el rango usado
      try {
        const worksheetEl = sheetDoc.getElementsByTagNameNS(MAIN_NS, 'worksheet')[0];
        const dimRef = 'A1:' + colIndexToLetter(maxIdx + 1) + String(lastRow);
        let dimEl = sheetDoc.getElementsByTagNameNS(MAIN_NS, 'dimension')[0];
        if (!dimEl) {
          dimEl = sheetDoc.createElementNS(MAIN_NS, 'dimension');
          dimEl.setAttribute('ref', dimRef);
          if (worksheetEl.firstChild) worksheetEl.insertBefore(dimEl, worksheetEl.firstChild);
          else worksheetEl.appendChild(dimEl);
        } else {
          dimEl.setAttribute('ref', dimRef);
        }
        progressLog && progressLog('Dimension ajustada a ' + dimRef);
      } catch(e) { /* ignore */ }

      // 7) Escribir de vuelta y descargar
      progressSet(95); progressLog('Escribiendo cambios en ZIP…');
      const s = new XMLSerializer();
      const newSheetXml = s.serializeToString(sheetDoc);
      zip.file(sheetPath, newSheetXml);
      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const blob = new Blob([zipBlob], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const outName = buildSafeOutName(forecastFile.name);
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = outName; a.click(); setTimeout(()=> URL.revokeObjectURL(a.href), 2000);
      progressSet(100); progressLog('Descarga iniciada. Listo.');
      setTimeout(()=> progressHide(), 1500);
    }

      // (Eliminado) Convertir Delfor y Crear Last LAR

      btnCreate.addEventListener('click', async ()=>{

        if (!fFile){ alert('Selecciona primero el Forecast'); return; }
        const oldText = btnCreate.textContent;
        btnCreate.textContent = 'Procesando…';
        btnCreate.disabled = true;
        try{
          // Patching de hoja para preservar tablas y fórmulas
          await runCreateExcelPreserve(dFile, fFile);
        } catch(e){
          console.error(e);
          alert('Error al generar el Forecast actualizado: ' + (e?.message||e));

    function openPopoverForSelectWithSearch(selectEl, title, onApply, fromBtn){
      closeAnyPopover();
      let left = window.innerWidth/2-120, top = window.innerHeight/2-100;
      if (fromBtn) {
        const rect = fromBtn.getBoundingClientRect();
        left = rect.left + window.scrollX;
        top = rect.bottom + 8 + window.scrollY;
      }
      const pop = document.createElement('div');
      pop.className = 'popover';
      pop.style.left = `${left}px`;
      pop.style.top = `${top}px`;
      const header = document.createElement('div');
      header.className = 'font-semibold mb-2 text-brand-700 text-base';
      header.textContent = title;
      pop.appendChild(header);
      const search = document.createElement('input');
      search.type = 'text';
      search.className = 'popover-search text-base px-3 py-2 border border-brand-600 rounded-lg mb-2';
      search.placeholder = 'Buscar...';
      pop.appendChild(search);
      const list = document.createElement('div');
      list.className = 'popover-list';
      pop.appendChild(list);
      function renderList(){
        list.innerHTML = '';
        const q = search.value.toLowerCase();
        [...selectEl.options].forEach((opt, idx)=>{
          if(!opt.text.toLowerCase().includes(q)) return;
          const row = document.createElement('label');
          row.className = 'flex items-center gap-2 text-base font-medium px-2 py-1 rounded hover:bg-brand-100 cursor-pointer';
          row.innerHTML = `<input type="checkbox" ${opt.selected?'checked':''} data-index="${idx}"> <span>${opt.text}</span>`;
          list.appendChild(row);
        });
      }
      search.addEventListener('input', renderList);
      renderList();
      const btns = document.createElement('div');
      btns.className = 'popover-btns';
      btns.innerHTML = `<button data-act="all" class="px-3 py-1 rounded bg-brand-600 text-white">Todo</button><button data-act="none" class="px-3 py-1 rounded bg-gray-200">Ninguno</button><button data-act="cancel" class="px-3 py-1 rounded bg-gray-200">Cancelar</button><button data-act="apply" class="px-3 py-1 rounded bg-brand-600 text-white">Aplicar</button>`;
      pop.appendChild(btns);
      btns.addEventListener('click', (ev)=>{
        const act = ev.target?.dataset?.act;
        if(act==='all'){
          list.querySelectorAll('input[type="checkbox"]').forEach(c=> c.checked=true);
        } else if(act==='none'){
          list.querySelectorAll('input[type="checkbox"]').forEach(c=> c.checked=false);
        } else if(act==='cancel'){
          closeAnyPopover();
        } else if(act==='apply'){
          const checks = [...list.querySelectorAll('input[type="checkbox"]')];
          checks.forEach(ch=>{
            const idx = Number(ch.dataset.index);
            selectEl.options[idx].selected = ch.checked;
          });
          closeAnyPopover();
          onApply && onApply();
        }
      });
      document.body.appendChild(pop);
      window._popoverDocClose = function(e){
        if(!pop.contains(e.target)) {
          closeAnyPopover();
          document.removeEventListener('click', window._popoverDocClose);
          window._popoverDocClose = null;
        }
      };
      setTimeout(()=> document.addEventListener('click', window._popoverDocClose), 0);
    }

    function closeAnyPopover(){
      document.querySelectorAll('.popover').forEach(p=> p.remove());
      if(window._popoverDocClose) {
        document.removeEventListener('click', window._popoverDocClose);
        window._popoverDocClose = null;
      }
    }

    function showToastDiferencia(cliente, piezasDiff, refs, meses, plantas, refsDiffs) {
      let toast = document.querySelector('.toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.className = 'toast';
        document.body.appendChild(toast);
      }
      const totalOld = piezasDiff < 0 ? Math.abs(piezasDiff) + refsDiffs.reduce((s, r) => s + (r.diff < 0 ? Math.abs(r.diff) : 0), 0) : refsDiffs.reduce((s, r) => s + (r.diff < 0 ? Math.abs(r.diff) : 0), 0);
      const porcentaje = totalOld ? (((piezasDiff * -1) / totalOld)).toFixed(1) : '0';
      let signo = '';
      if (porcentaje > 0) signo = '+';
      else if (porcentaje < 0) signo = '-';
      toast.innerHTML = `<span>${cliente.toUpperCase()}: Variación de ${signo}${Math.abs(porcentaje)}% cantidad piezas</span><button class='toast-close' title='Cerrar'>&times;</button>`;
      toast.classList.add('show');
      toast.querySelector('.toast-close').onclick = () => toast.classList.remove('show');
      setTimeout(() => toast.classList.remove('show'), 18000);
    }

    // ---------- Top 5 logic (único handler) ----------
    document.addEventListener("click", function(e) {
      if (e.target && e.target.id === "btnTop5") {
        const client = state.currentClient;
        const root = document.querySelector(`.clientPanel[data-client="${client}"]`);
        const rows = getFilteredRows(client, root);

        // Agrupa por refTeix (BV). Si no hay BV, usa refCli. Para MCI, usa r.ref
        const piezas = {};
        rows.forEach(r => {
          const key = r.refTeix || r.refCli || r.ref || "";
          if (!key) return;
          piezas[key] = (piezas[key] || 0) + (Number(r.qty) || 0);
        });

        const top5 = Object.entries(piezas)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 5);

        const top5List = document.getElementById("top5List");
        top5List.innerHTML = "";

        top5.forEach(([refBV, qty], idx) => {
          const row = rows.find(r => (r.refTeix || r.refCli || "") === refBV);
          const refClienteT = row?.refCli || "-"; // viene de columna T si existe

          const div = document.createElement("div");
          div.className = "flex flex-col items-center gap-2 p-4 border rounded-xl shadow-glow bg-white dark:bg-gray-800";

          div.innerHTML = `
            <div class='text-lg font-bold mb-2'>${idx + 1}. ${refBV}</div>
            <div class='text-xs text-gray-600 -mt-1 mb-2'>
              Ref. cliente (T): <b>${refClienteT}</b>
            </div>
            <div class='text-2xl font-extrabold text-brand-700 mb-2'>
              ${qty.toLocaleString()}
            </div>
            <div class='top5-3d' id='top5-3d-${idx}' style='width:180px;height:180px;background:#f3f4f6;border-radius:1rem;'></div>
            <div class='text-xs text-gray-500 mt-1 font-mono'>
              STL: <span id='stl-name-${idx}'>${refBV}.stl</span>
            </div>
          `;

          top5List.appendChild(div);
          setTimeout(() => renderTop5Model(refBV, `top5-3d-${idx}`), 100);
        });

        document.getElementById("top5Modal").classList.remove("hidden");
      }
    });

    // --- Renderizar 3D con stl_viewer ---
    const top5Viewers = {};

    async function stlExists(url){
      try{
        const res = await fetch(url, { method:'HEAD', cache:'no-store' });
        return res.ok;
      }catch{ return false; }
    }

    function buildStlCandidates(ref){
      const basePaths = ['/static/stl/', 'static/stl/'];
      const names = new Set([
        ref,
        String(ref).trim(),
        String(ref).toUpperCase(),
        String(ref).toLowerCase(),
        String(ref).replace(/\s+/g,'_'),
        String(ref).replace(/\s+/g,'-')
      ]);
      const exts = ['.stl', '.STL'];
      const cands = [];
      for(const bp of basePaths){
        for(const n of names){
          for(const ext of exts){
            cands.push(`${bp}${n}${ext}`);
          }
        }
      }
      return [...new Set(cands)];
    }

    async function resolveStlPath(ref){
      const cands = buildStlCandidates(ref);
      for(const url of cands){
        if(await stlExists(url)) return url;
      }
      return null;
    }

    async function renderTop5Model(ref, containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      container.innerHTML = "";
      try {
        if (top5Viewers[containerId] && typeof top5Viewers[containerId].dispose === 'function') {
          top5Viewers[containerId].dispose();
        }
      } catch {}

      const stlPath = await resolveStlPath(ref);
      const stlNameSpan = container.parentElement && container.parentElement.querySelector('span[id^="stl-name-"]');
      if(!stlPath){
        container.innerHTML = "<div class='small text-center text-gray-400'>No hay modelo 3D disponible.</div>";
        if (stlNameSpan) stlNameSpan.textContent = ref + ".stl";
        return;
      }
      if (stlNameSpan) stlNameSpan.textContent = stlPath.split('/').pop();

      const initViewer = () => {
        try {
          top5Viewers[containerId] = new StlViewer(container, {
            auto_rotate: true,
            models: [ { filename: stlPath, color: "#0071bc" } ]
          });
        } catch (err) {
          container.innerHTML = "<div class='small text-center text-gray-400'>No hay modelo 3D disponible.</div>";
        }
      };
      if (!window.StlViewer) {
        const s = document.createElement('script');
        s.src = (window.stl_viewer_script_path || '') + 'stl_viewer.min.js';
        s.onload = initViewer;
        s.onerror = () => {
          container.innerHTML = "<div class='small text-center text-gray-400'>No hay modelo 3D disponible.</div>";
        };
        document.body.appendChild(s);
      } else {
        initViewer();
      }
    }
  </script>
</body>
